name: Provision production database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ vars.CPANEL_HOST }}
      SSH_PORT: ${{ vars.CPANEL_PORT }}
      SSH_USER: ${{ secrets.CPANEL_USER }}
      SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
      APP_PATH: ${{ vars.CPANEL_APP_PATH }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_KEY SSH_KNOWN_HOSTS APP_PATH DB_DATABASE DB_USERNAME DB_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production setting: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload database credentials
        shell: bash
        run: |
          credentials="$RUNNER_TEMP/database-${GITHUB_RUN_ID}.env"
          {
            printf 'DB_DATABASE=%s\n' "$DB_DATABASE"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
          } > "$credentials"
          chmod 600 "$credentials"
          scp -o BatchMode=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key -P "$SSH_PORT" "$credentials" \
            "$SSH_USER@$SSH_HOST:"

      - name: Create MariaDB database and migrate production data
        shell: bash
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'bash -s' -- "$APP_PATH" "database-${GITHUB_RUN_ID}.env" <<'REMOTE'
          set -euo pipefail

          deploy_root=$1
          credentials="$HOME/$2"
          [[ -f "$credentials" ]] || {
            echo 'The uploaded database credentials are unavailable.' >&2
            exit 1
          }
          trap 'rm -f "$credentials"' EXIT
          # The file is generated by this workflow from protected GitHub secrets.
          source "$credentials"
          db_database=$DB_DATABASE
          db_username=$DB_USERNAME
          db_password=$DB_PASSWORD
          unset DB_DATABASE DB_USERNAME DB_PASSWORD
          current="$deploy_root/current"
          shared="$deploy_root/shared"
          env_file="$shared/.env"
          sqlite_file="$shared/database/database.sqlite"

          case "$deploy_root" in
            "$HOME"/*) ;;
            *) echo 'CPANEL_APP_PATH must be inside the cPanel home directory.' >&2; exit 1 ;;
          esac
          [[ -d "$current" && -f "$current/artisan" && -f "$env_file" ]] || {
            echo 'The deployed Laravel application is unavailable.' >&2
            exit 1
          }
          migrating_from_sqlite=0
          if grep -q '^DB_CONNECTION=sqlite$' "$env_file"; then
            migrating_from_sqlite=1
          fi
          command -v uapi >/dev/null 2>&1 || {
            echo 'cPanel UAPI is unavailable.' >&2
            exit 1
          }

          check_uapi() {
            php -r '
              $payload = json_decode(stream_get_contents(STDIN), true);
              if (!is_array($payload) || ($payload["result"]["status"] ?? 0) !== 1) {
                  $errors = $payload["result"]["errors"] ?? ["Unknown cPanel API error"];
                  fwrite(STDERR, implode("; ", (array) $errors) . PHP_EOL);
                  exit(1);
              }
            '
          }

          database_list=$(uapi --output=json Mysql list_databases)
          database_exists=0
          if printf '%s' "$database_list" | php -r '
            $name = $argv[1];
            $payload = json_decode(stream_get_contents(STDIN), true);
            foreach (($payload["result"]["data"] ?? []) as $database) {
                if (($database["database"] ?? null) === $name) exit(0);
            }
            exit(1);
          ' "$db_database"; then
            database_exists=1
          fi

          # A SQLite production environment means this MariaDB target is the
          # incomplete cutover database from an earlier provisioning attempt.
          if [[ "$database_exists" == 1 && "$migrating_from_sqlite" == 1 ]]; then
            uapi --output=json Mysql delete_database name="$db_database" | check_uapi
            database_exists=0
          fi
          if [[ "$database_exists" == 0 ]]; then
            uapi --output=json Mysql create_database name="$db_database" | check_uapi
          fi

          user_list=$(uapi --output=json Mysql list_users)
          if ! printf '%s' "$user_list" | php -r '
            $name = $argv[1];
            $payload = json_decode(stream_get_contents(STDIN), true);
            foreach (($payload["result"]["data"] ?? []) as $user) {
                if (($user["user"] ?? null) === $name) exit(0);
            }
            exit(1);
          ' "$db_username"; then
            uapi --output=json Mysql create_user name="$db_username" password="$db_password" | check_uapi
          else
            uapi --output=json Mysql set_password user="$db_username" password="$db_password" | check_uapi
          fi

          uapi --output=json Mysql set_privileges_on_database \
            user="$db_username" database="$db_database" \
            privileges='ALL PRIVILEGES' | check_uapi

          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          env_backup="$shared/.env.sqlite-$timestamp"
          sqlite_backup="$shared/database/database.sqlite-$timestamp"
          cp -p "$env_file" "$env_backup"
          if [[ -f "$sqlite_file" ]]; then
            cp -p "$sqlite_file" "$sqlite_backup"
          fi

          restore_sqlite() {
            cp -p "$env_backup" "$env_file"
            cd "$current"
            php artisan config:clear >/dev/null 2>&1 || true
            php artisan config:cache >/dev/null 2>&1 || true
            php artisan up >/dev/null 2>&1 || true
          }
          trap restore_sqlite ERR

          cd "$current"
          php artisan down --retry=60

          grep -vE '^(DB_CONNECTION|DB_HOST|DB_PORT|DB_DATABASE|DB_USERNAME|DB_PASSWORD|DB_CHARSET|DB_COLLATION|DB_ENGINE)=' \
            "$env_file" > "$shared/.env.next"
          {
            printf '\nDB_CONNECTION=mysql\n'
            printf 'DB_HOST=localhost\n'
            printf 'DB_PORT=3306\n'
            printf 'DB_DATABASE=%s\n' "$db_database"
            printf 'DB_USERNAME=%s\n' "$db_username"
            printf 'DB_PASSWORD=%s\n' "$db_password"
            printf 'DB_CHARSET=utf8mb4\n'
            printf 'DB_COLLATION=utf8mb4_unicode_ci\n'
            printf 'DB_ENGINE=InnoDB\n'
          } >> "$shared/.env.next"
          chmod 600 "$shared/.env.next"
          mv "$shared/.env.next" "$env_file"

          php artisan config:clear
          php artisan migrate --force

          if [[ "$migrating_from_sqlite" == 1 && -s "$sqlite_backup" ]]; then
            SQLITE_SOURCE="$sqlite_backup" \
            MYSQL_DATABASE="$db_database" \
            MYSQL_USERNAME="$db_username" \
            MYSQL_PASSWORD="$db_password" \
            php <<'PHP'
          <?php
          declare(strict_types=1);

          $sqlite = new PDO('sqlite:' . getenv('SQLITE_SOURCE'));
          $mysql = new PDO(
              'mysql:host=localhost;port=3306;dbname=' . getenv('MYSQL_DATABASE') . ';charset=utf8mb4',
              getenv('MYSQL_USERNAME'),
              getenv('MYSQL_PASSWORD'),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $tables = $sqlite->query(
              "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' ORDER BY name"
          )->fetchAll(PDO::FETCH_COLUMN);
          $mysql->exec('SET FOREIGN_KEY_CHECKS=0');
          try {
              foreach ($tables as $table) {
                  if ($table === 'migrations' || !preg_match('/^[A-Za-z0-9_]+$/', $table)) {
                      continue;
                  }
                  $exists = $mysql->prepare(
                      'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = ? AND table_name = ?'
                  );
                  $exists->execute([getenv('MYSQL_DATABASE'), $table]);
                  if ((int) $exists->fetchColumn() !== 1) {
                      continue;
                  }
                  $sourceColumns = $sqlite->query("PRAGMA table_info(`{$table}`)")->fetchAll(PDO::FETCH_ASSOC);
                  $targetColumns = $mysql->query("SHOW COLUMNS FROM `{$table}`")->fetchAll(PDO::FETCH_COLUMN);
                  $columns = array_values(array_intersect(
                      array_column($sourceColumns, 'name'),
                      $targetColumns
                  ));
                  if ($columns === []) {
                      continue;
                  }
                  $quoted = implode(', ', array_map(fn ($column) => "`{$column}`", $columns));
                  $placeholders = implode(', ', array_fill(0, count($columns), '?'));
                  $select = $sqlite->query("SELECT {$quoted} FROM `{$table}`");
                  $insert = $mysql->prepare("INSERT INTO `{$table}` ({$quoted}) VALUES ({$placeholders})");
                  $count = 0;
                  while ($row = $select->fetch(PDO::FETCH_ASSOC)) {
                      $insert->execute(array_map(fn ($column) => $row[$column], $columns));
                      $count++;
                  }
                  printf("Migrated %d row(s) from %s.\n", $count, $table);
              }
          } finally {
              $mysql->exec('SET FOREIGN_KEY_CHECKS=1');
          }
          PHP
          fi

          php artisan db:seed --force
          php artisan config:cache
          php artisan view:cache
          php artisan up
          trap - ERR

          php artisan migrate:status --no-interaction
          php -r '
            $pdo = new PDO(
                "mysql:host=localhost;port=3306;dbname=" . $argv[1] . ";charset=utf8mb4",
                $argv[2],
                $argv[3],
                [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
            );
            $count = (int) $pdo->query("SELECT COUNT(*) FROM migrations")->fetchColumn();
            printf("MariaDB connection verified; %d migrations recorded.\n", $count);
          ' "$db_database" "$db_username" "$db_password"
          REMOTE

      - name: Verify production
        shell: bash
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://gofreshshoelaundry.com/api/health
