name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gofreshshoelaundry.com
    env:
      SSH_HOST: ${{ vars.CPANEL_HOST }}
      SSH_PORT: ${{ vars.CPANEL_PORT }}
      SSH_USER: ${{ secrets.CPANEL_USER }}
      SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
      APP_PATH: ${{ vars.CPANEL_APP_PATH }}
      WEB_ROOT: ${{ vars.CPANEL_WEB_ROOT }}
      LARAVEL_ENV_FILE: ${{ secrets.LARAVEL_ENV_FILE }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_KEY SSH_KNOWN_HOSTS APP_PATH WEB_ROOT LARAVEL_ENV_FILE DB_DATABASE DB_USERNAME DB_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production setting: $name" >&2
              exit 1
            fi
          done

      - name: Package application
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude=node_modules \
            --exclude=vendor \
            --exclude=tests \
            -czf "$RUNNER_TEMP/api-${GITHUB_SHA}.tar.gz" .

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload release
        shell: bash
        run: |
          printf '%s\n' "$LARAVEL_ENV_FILE" > "$RUNNER_TEMP/production.env"
          grep -vE '^(DB_CONNECTION|DB_HOST|DB_PORT|DB_DATABASE|DB_USERNAME|DB_PASSWORD|DB_CHARSET|DB_COLLATION|DB_ENGINE)=' \
            "$RUNNER_TEMP/production.env" > "$RUNNER_TEMP/production.env.next"
          mv "$RUNNER_TEMP/production.env.next" "$RUNNER_TEMP/production.env"
          {
            printf '\nDB_CONNECTION=mysql\n'
            printf 'DB_HOST=localhost\n'
            printf 'DB_PORT=3306\n'
            printf 'DB_DATABASE=%s\n' "$DB_DATABASE"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_CHARSET=utf8mb4\n'
            printf 'DB_COLLATION=utf8mb4_unicode_ci\n'
            printf 'DB_ENGINE=InnoDB\n'
          } >> "$RUNNER_TEMP/production.env"
          chmod 600 "$RUNNER_TEMP/production.env"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            "$RUNNER_TEMP/api-${GITHUB_SHA}.tar.gz" "$RUNNER_TEMP/production.env" \
            "$SSH_USER@$SSH_HOST:"

      - name: Activate release
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'bash -s' -- "$APP_PATH" "$WEB_ROOT" "api-${GITHUB_SHA}.tar.gz" \
            'production.env' "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail

          deploy_root=$1
          web_root=$2
          archive=$3
          env_file=$4
          revision=$5

          case "$deploy_root" in
            "$HOME"/*) ;;
            *) echo 'CPANEL_APP_PATH must be inside the cPanel home directory.' >&2; exit 1 ;;
          esac
          case "$web_root" in
            "$HOME"/*) ;;
            *) echo 'CPANEL_WEB_ROOT must be inside the cPanel home directory.' >&2; exit 1 ;;
          esac

          mkdir -p "$deploy_root/releases" "$deploy_root/shared/storage/app/public"
          mkdir -p "$deploy_root/shared/database" "$web_root"
          mkdir -p "$deploy_root/shared/storage/framework/cache" \
            "$deploy_root/shared/storage/framework/sessions" \
            "$deploy_root/shared/storage/framework/views" \
            "$deploy_root/shared/storage/logs"

          exec 9>"$deploy_root/.deploy.lock"
          if command -v flock >/dev/null 2>&1; then
            flock -w 180 9
          fi

          install -m 600 "$HOME/$env_file" "$deploy_root/shared/.env"
          rm -f "$HOME/$env_file"
          touch "$deploy_root/shared/database/database.sqlite"

          release="$deploy_root/releases/$revision"
          rm -rf "$release"
          mkdir -p "$release"
          tar -xzf "$HOME/$archive" -C "$release"
          rm -f "$HOME/$archive"

          ln -s "$deploy_root/shared/.env" "$release/.env"
          rm -rf "$release/storage"
          ln -s "$deploy_root/shared/storage" "$release/storage"
          rm -f "$release/database/database.sqlite"
          ln -s "$deploy_root/shared/database/database.sqlite" \
            "$release/database/database.sqlite"

          # Carry the independently deployed Vue build into the new API release.
          if [[ -d "$deploy_root/current/public" ]]; then
            shopt -s dotglob nullglob
            for item in "$deploy_root/current/public"/*; do
              name=${item##*/}
              case "$name" in
                index.php|.htaccess|storage) continue ;;
              esac
              cp -a "$item" "$release/public/"
            done
            shopt -u dotglob nullglob
          fi

          cd "$release"
          composer install --no-dev --no-interaction --prefer-dist \
            --optimize-autoloader --no-progress
          php artisan migrate --force
          php artisan db:seed --force
          php artisan storage:link
          php artisan config:cache
          php artisan view:cache

          chmod -R ug+rwX "$deploy_root/shared/storage"
          ln -sfn "$release" "$deploy_root/current"

          cp "$release/public/.htaccess" "$web_root/.htaccess"
          ln -sfn "$deploy_root/current/public/index.php" "$web_root/index.php"
          ln -sfn "$deploy_root/shared/storage/app/public" "$web_root/storage"
          REMOTE

      - name: Verify production
        shell: bash
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://gofreshshoelaundry.com/api/health
