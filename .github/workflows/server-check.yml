name: Check production server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ vars.CPANEL_HOST }}
      SSH_PORT: ${{ vars.CPANEL_PORT }}
      SSH_USER: ${{ secrets.CPANEL_USER }}
      SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production setting: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Inspect deployment prerequisites
        shell: bash
        run: |
          ssh -vvv -o BatchMode=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          printf 'host=%s\n' "$(hostname)"
          printf 'home=%s\n' "$HOME"
          printf 'php=%s\n' "$(command -v php || true)"
          php -r 'printf("php_version=%s\n", PHP_VERSION);' || true
          printf 'composer=%s\n' "$(command -v composer || true)"
          composer --version 2>/dev/null || true
          if [[ -e "$HOME/public_html" ]]; then
            ls -ld "$HOME/public_html"
            echo 'public_html_contents:'
            find "$HOME/public_html" -mindepth 1 -maxdepth 2 \
              -printf '%y %P\n' | sort | head -200
          else
            echo 'public_html=missing'
          fi

          echo 'database_extensions:'
          php -m | grep -Ei 'mysqli|pdo_mysql|pdo_sqlite|sqlite3' | sort || true

          if command -v uapi >/dev/null 2>&1; then
            echo 'domains:'
            uapi --output=jsonpretty DomainInfo list_domains || true
            echo 'gofresh_domain:'
            uapi --output=jsonpretty DomainInfo single_domain_data \
              domain=gofreshshoelaundry.com || true
          fi

          log_dir="$HOME/apps/gofreshshoelaundry/shared/storage/logs"
          latest_log=$(find "$log_dir" -maxdepth 1 -type f -name 'laravel*.log' \
            -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
          if [[ -n "$latest_log" ]]; then
            if grep -q 'attempt to write a readonly database' "$latest_log"; then
              echo 'laravel_error=sqlite_readonly'
            elif grep -q 'unable to open database file' "$latest_log"; then
              echo 'laravel_error=sqlite_unavailable'
            elif grep -q 'no such table' "$latest_log"; then
              echo 'laravel_error=database_schema'
            elif grep -q 'could not find driver' "$latest_log"; then
              echo 'laravel_error=database_driver'
            elif grep -q 'No application encryption key' "$latest_log"; then
              echo 'laravel_error=application_key'
            elif grep -q 'The MAC is invalid' "$latest_log"; then
              echo 'laravel_error=session_encryption'
            elif grep -q 'Permission denied' "$latest_log"; then
              echo 'laravel_error=filesystem_permission'
            else
              echo 'laravel_error=unclassified'
            fi
            exception_class=$(grep 'production.ERROR' "$latest_log" | tail -1 | \
              sed -n 's/.*"exception":"\[object\] (\([^(:]*\).*/\1/p')
            if [[ -n "$exception_class" ]]; then
              printf 'laravel_exception_class=%s\n' "$exception_class"
            fi
          fi
          REMOTE
